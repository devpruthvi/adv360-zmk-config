# keymap-drawer settings; used by `nix run .#draw`
parse_config:
  raw_binding_map:
    # Mouse movement macros expand to several tokens, so label them directly
    "&mmv MOVE_LEFT": "Mouse ←"
    "&mmv MOVE_DOWN": "Mouse ↓"
    "&mmv MOVE_UP": "Mouse ↑"
    "&mmv MOVE_RIGHT": "Mouse →"
    "&msc SCRL_LEFT": "Wheel ←"
    "&msc SCRL_DOWN": "Wheel ↓"
    "&msc SCRL_UP": "Wheel ↑"
    "&msc SCRL_RIGHT": "Wheel →"
    "&mkp MB1": "Click L"
    "&mkp MB2": "Click R"
    "&mkp MB3": "Click M"
    # Clipboard (Miryoku default codes)
    "&kp K_UNDO": "Undo"
    "&kp K_AGAIN": "Redo"
    "&kp LC(INS)": "Copy"
    "&kp LS(INS)": "Paste"
    "&kp LS(DEL)": "Cut"
    # Double-tap guards
    "&u_to_base": {t: "Base", h: "2× tap"}
    "&u_to_extra": {t: "Colemak", h: "2× tap"}
    "&u_to_tap": {t: "Tap", h: "2× tap"}
    "&u_to_nav": {t: "Nav", h: "2× tap"}
    "&u_to_mouse": {t: "Mouse", h: "2× tap"}
    "&u_to_media": {t: "Media", h: "2× tap"}
    "&u_to_num": {t: "Num", h: "2× tap"}
    "&u_to_sym": {t: "Sym", h: "2× tap"}
    "&u_to_fun": {t: "Fun", h: "2× tap"}
    "&u_boot": {t: "Boot", h: "2× tap"}
    # Shift variants
    "&u_bt_sel_0": {t: "BT 0", h: "⇧ clear"}
    "&u_bt_sel_1": {t: "BT 1", h: "⇧ clear"}
    "&u_bt_sel_2": {t: "BT 2", h: "⇧ clear"}
    "&u_bt_sel_3": {t: "BT 3", h: "⇧ clear"}
    "&u_out_tog": {t: "USB/BLE", h: "⇧ USB"}
    "&u_caps_word": {t: "Caps Word", h: "⇧ Caps"}
    "&studio_unlock": "Studio"
    "&rgb_ug RGB_TOG": "RGB on/off"
    "&rgb_ug RGB_EFF": "RGB effect"
    "&rgb_ug RGB_HUI": "RGB hue"
    "&rgb_ug RGB_SAI": "RGB sat"
    "&rgb_ug RGB_BRI": "RGB bright"
    "&ext_power EP_TOG": "LED power"
  # Leave transparent keys blank instead of ▽
  trans_legend: {t: "", type: trans}

draw_config:
  dark_mode: auto
  key_w: 60
  key_h: 56
  key_rx: 8
  key_ry: 8
  inner_pad_w: 3
  inner_pad_h: 3
  # Taller front face so hold legends sit on it, like Miryoku's front legends
  draw_key_sides: true
  key_side_pars:
    rel_y: 6
    rel_h: 18
  append_colon_to_layer_header: false
  # One color per layer: layer names on keys, held-key tint, overview corners
  svg_extra_style: |
    svg.keymap {
      --base: #475569; --extra: #4f46e5; --tap: #64748b; --button: #0284c7;
      --nav: #d97706; --mouse: #0891b2; --media: #c026d3;
      --num: #2563eb; --sym: #16a34a; --fun: #dc2626;
      --key-bg: #f8fafc; --key-border: #cbd5e1; --text: #0f172a; --muted: #64748b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 500;
      fill: var(--text);
    }
    .layer-base { --layer: var(--base); }
    .layer-extra { --layer: var(--extra); }
    .layer-tap { --layer: var(--tap); }
    .layer-button { --layer: var(--button); }
    .layer-nav { --layer: var(--nav); }
    .layer-mouse { --layer: var(--mouse); }
    .layer-media { --layer: var(--media); }
    .layer-num { --layer: var(--num); }
    .layer-sym { --layer: var(--sym); }
    .layer-fun { --layer: var(--fun); }

    /* Layer title, centered by headings.py */
    text.label {
      font-size: 20px;
      font-weight: 800;
      text-anchor: middle;
      text-transform: capitalize;
      fill: var(--text);
      stroke: none;
    }

    /* Layer names on keys, on the key's front face in that layer's color */
    text.layer-activator { text-decoration: none; text-transform: capitalize; font-weight: 800; }
    a[href="#base"] text { fill: var(--base); }
    a[href="#extra"] text { fill: var(--extra); }
    a[href="#tap"] text { fill: var(--tap); }
    a[href="#button"] text { fill: var(--button); }
    a[href="#nav"] text { fill: var(--nav); }
    a[href="#mouse"] text { fill: var(--mouse); }
    a[href="#media"] text { fill: var(--media); }
    a[href="#num"] text { fill: var(--num); }
    a[href="#sym"] text { fill: var(--sym); }
    a[href="#fun"] text { fill: var(--fun); }

    rect.key { fill: var(--key-bg); stroke: var(--key-border); }
    rect.side { filter: brightness(93%); }
    rect.held { fill: var(--layer); fill-opacity: 0.22; }
    text.hold, text.shifted { fill: var(--muted); font-weight: 600; }
    .trans text { fill: var(--muted); }
    text.footer { fill: var(--muted); stroke: none; font-size: 12px; }

    /* Overview (overview.py): hold in grey top-left, opposite-thumb layers in colored corners */
    .layer-Overview text.tl, .layer-Overview text.tr,
    .layer-Overview text.bl, .layer-Overview text.br { font-size: 11px; font-weight: 700; }
    .layer-Overview text.tl { fill: var(--muted); font-weight: 600; }
    .layer-Overview .lh text.tr { fill: var(--sym); }
    .layer-Overview .lh text.bl { fill: var(--fun); }
    .layer-Overview .lh text.br { fill: var(--num); }
    .layer-Overview .rh text.tr { fill: var(--nav); }
    .layer-Overview .rh text.bl { fill: var(--media); }
    .layer-Overview .rh text.br { fill: var(--mouse); }
    .layer-Overview [class*=" to-"] text.tl { text-transform: capitalize; font-weight: 800; }
    .layer-Overview .to-nav text.tl { fill: var(--nav); }
    .layer-Overview .to-mouse text.tl { fill: var(--mouse); }
    .layer-Overview .to-media text.tl { fill: var(--media); }
    .layer-Overview .to-num text.tl { fill: var(--num); }
    .layer-Overview .to-sym text.tl { fill: var(--sym); }
    .layer-Overview .to-fun text.tl { fill: var(--fun); }
    .layer-Overview .to-button text.tl { fill: var(--button); }

    @media (prefers-color-scheme: dark) {
      svg.keymap {
        --key-bg: #1e293b; --key-border: #334155; --text: #e2e8f0; --muted: #94a3b8;
        --base: #64748b; --tap: #475569;
      }
      rect.key { fill: var(--key-bg); stroke: var(--key-border); }
    }
